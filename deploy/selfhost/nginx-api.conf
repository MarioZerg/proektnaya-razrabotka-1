# Функции и файлы: API_HOST
#   /<id функции>                     — тот же id, что был на functions.poehali.dev
#   /projects/<проект>/bucket/<ключ>  — файлы, загруженные функциями (было cdn.poehali.dev)
#   /projects/<проект>/files/<имя>    — картинки инструкций (было cdn.poehali.dev)
map $fn_id $fn_name {
    include /etc/nginx/yarplan-functions.map;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name API_HOST;

    client_max_body_size 60m;

    location ~ "^/(?<fn_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/?(?<fn_rest>.*)$" {
        if ($fn_name = "") { return 404; }
        proxy_pass http://unix:/run/yarplan-fn/$fn_name/sock:/$fn_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ "^/projects/[^/]+/bucket/(?<key>.+)$" {
        if ($key ~ "\.ctype$") { return 404; }
        alias /opt/yarplan/files/files/$key;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    location ~ "^/projects/[^/]+/files/(?<name>.+)$" {
        if ($name ~ "\.ctype$") { return 404; }
        alias /opt/yarplan/files/static/$name;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location = / { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 404; }
}
