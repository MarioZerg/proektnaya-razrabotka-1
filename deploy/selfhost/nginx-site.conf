# Сайт системы: SITE_HOSTS
server {
    listen 80;
    listen [::]:80;
    server_name SITE_HOSTS;

    root /opt/yarplan/site;
    index index.html;

    # Собранные файлы с хэшем в имени не меняются — пусть браузер хранит их долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # .mjs (воркер pdf.js для печати ярлыков) в стандартном mime.types nginx
        # не описан и уходил как application/octet-stream. Браузер такой модуль
        # не запускает — печать ярлыков OZON и Яндекса падала, а терминал
        # показывал «Обновляем систему…».
        location ~* .mjs$ {
            types { }
            default_type text/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # index.html — всегда свежий, иначе после обновления сотрудники видят старую версию.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
